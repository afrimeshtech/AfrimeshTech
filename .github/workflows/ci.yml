name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: no point burning minutes
# on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

  verify:
    name: Business-rule verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs against the embedded PostgreSQL, so no service container is
      # needed. Seeding is itself an end-to-end exercise of the commerce path:
      # if the seed completes, orders, reservations and the ledger all work.
      - name: Create and seed the database
        run: npm run db:reset

      - name: Verify business rules
        run: npm run verify

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-not-used-at-runtime-000000
